<script>
'use strict';

const STORAGE_KEY = 'lppl_pms_session_v3';
const state = {
  token: '', me: null, permissions: {}, departments: [], activeUsers: [],
  managedDepartments: [], reportDepartments: [], taskCategories: [], ticketCategories: [], priorities: [], companyName: '', appName: 'LPPL - PMS',
  page: 'dashboard', myTasks: null, tickets: null, ticketUsers: [], report: null,
  ticketScope: 'mine', ticketOwner: 'all', ticketStatus: 'open', ticketFilters: {},
  userRows: [], employeeEditorData: null,
  employeeFilters: { search: '', reportsTo: '', department: '', role: '', status: 'Active' },
  employeeImportFileData: null, employeeImportPreview: null,
  employeeLastSyncAt: 0, employeePageLoaded: false,
  teamTasks: null, teamTaskTab: 'today', teamTaskCacheV45: {},
  teamTaskFilters: { department: '', userId: '', search: '', fromDate: '', toDate: '', page: 1, pageSize: 100 },
  teamTaskSearchTimer: null,
  accessScope: null,
  pageHtmlCache: {}, pageCacheAt: {}, navPrefetchStarted: false,
  unreadNotificationCount: 0, notificationPollSeconds: 60, notifications: [],
  notificationCountInitialized: false, notificationSoundArmed: false, notificationSoundEnabled: true,
  recurringWorkspace: null, recurringTab: 'my', recurringImportFileData: null,
  leaveMonth: '', leaveData: null,
  teamTaskSelections: {},
  pendingNotificationTicketId: '',
  taskWorkspaceScope: 'my', taskWorkspaceTab: 'today',
  rulesData: null,
  shiftRosterData: null, shiftRosterTab: 'team',
  shiftRosterFilters: { userId: '', fromDate: '', toDate: '' },
  dashboardFilters: { department:'', userId:'', fromDate:'', toDate:'' },
  categoryImportFileData: null
};
let lastLoadRetry = null;
let deferredInstallPrompt = null;
let bootstrapRetryTimer = null;
let ticketVoiceRecorder = null;
let ticketVoiceStream = null;
let ticketVoiceChunks = [];
let ticketVoiceBlob = null;
let notificationPollTimer = null;

window.addEventListener('load', startPortal);
window.addEventListener('beforeinstallprompt', event => {
  event.preventDefault();
  deferredInstallPrompt = event;
});

/*
 * Dynamic data refresh:
 * - Same-screen saves update local UI immediately after the server confirms.
 * - When the user comes back to the browser/tab, the active employee page
 *   silently re-syncs from Google Sheets without a manual browser refresh.
 */
window.addEventListener('focus', () => silentRefreshCurrentPage_());
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') silentRefreshCurrentPage_();
});

// Browser audio can play only after a user gesture. Arm the soft notification
// tone after the first click/tap/key press. The first bootstrap count never beeps.
function armNotificationSoundV431_() { state.notificationSoundArmed = true; }
window.addEventListener('pointerdown', armNotificationSoundV431_, { once: true });
window.addEventListener('keydown', armNotificationSoundV431_, { once: true });

function startPortal() {
  state.token = readStoredSession_();
  // Restore a known session directly. A temporary failure in the public
  // branding call must never send a logged-in employee back to the login form.
  if (state.token) {
    bootstrapApp(0);
    return;
  }
  callServer('api_publicBootstrap', [], data => {
    state.companyName = data.companyName;
    state.appName = data.appName;
    showLogin();
  }, () => showLogin(), true);
}

function readStoredSession_() {
  try { return localStorage.getItem(STORAGE_KEY) || sessionStorage.getItem(STORAGE_KEY) || ''; }
  catch (ignored) {
    try { return sessionStorage.getItem(STORAGE_KEY) || ''; } catch (alsoIgnored) { return ''; }
  }
}

function storeSession_(token) {
  try { localStorage.setItem(STORAGE_KEY, token); } catch (ignored) {}
  try { sessionStorage.setItem(STORAGE_KEY, token); } catch (ignored) {}
}

function removeStoredSession_() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (ignored) {}
  try { sessionStorage.removeItem(STORAGE_KEY); } catch (ignored) {}
}

function callServer(fnName, args, onSuccess, onError, publicCall) {
  const finalArgs = (args || []).slice();
  if (!publicCall) finalArgs.unshift(state.token);
  const fail = error => handleRequestError(error, fnName, onError);
  try {
    const runner = google.script.run
      .withSuccessHandler(response => {
        if (!response || response.ok === false) {
          fail(response && response.error ? response.error : 'The server returned an empty response.');
          return;
        }
        try { if (onSuccess) onSuccess(response.data); }
        catch (error) { fail('Page rendering error: ' + (error.message || String(error))); }
      })
      .withFailureHandler(fail);
    if (!runner[fnName]) throw new Error('Server function is unavailable: ' + fnName);
    runner[fnName].apply(runner, finalArgs);
  } catch (error) { fail(error); }
}

function handleRequestError(error, fnName, onError) {
  const message = error && error.message ? error.message : String(error || 'Unknown error');
  resetBusyButtons();

  // A modal can sit above the login screen. If a session expires while
  // Add/Edit Employee (or any other modal) is open, close the modal first.
  // Otherwise it looks as if the Save button did nothing.
  if (/^SESSION_EXPIRED(?:$|:)/.test(message)) {
    try { closeModal(); } catch (ignored) {}
    clearSession();
    showLogin('Your session expired or your access settings changed. Please log in again.');
    return;
  }

  toast(message, true);
  if (onError) onError(message);
  const content = document.getElementById('content');
  if (content && content.querySelector('.spinner')) {
    lastLoadRetry = () => navigate(state.page);
    content.innerHTML = '<div class="error-panel"><h2>Unable to load this page</h2><p>' +
      esc(message) + '</p><button class="btn" onclick="retryLastLoad()">Retry</button></div>';
  }
}

function showLogin(message) {
  // Always clear any open UI layer before showing login. This prevents an
  // expired-session modal from visually covering the login screen.
  try { closeModal(); } catch (ignored) {}
  try { closeUserMenu(); } catch (ignored) {}
  try { closeSidebarMobile(); } catch (ignored) {}

  document.getElementById('appShell').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginError').textContent = message || '';
  setTimeout(() => {
    const employeeId = document.getElementById('loginEmployeeId');
    if (employeeId) employeeId.focus();
  }, 50);
}

function submitLogin(event) {
  event.preventDefault();
  const employeeId = document.getElementById('loginEmployeeId').value;
  const password = document.getElementById('loginPassword').value;
  const button = document.getElementById('loginButton');
  setBusy(button, 'Logging in…');
  document.getElementById('loginError').textContent = '';
  callServer('api_login', [employeeId, password, navigator.userAgent], result => {
    state.token = result.token;
    storeSession_(state.token);
    document.getElementById('loginPassword').value = '';
    bootstrapApp();
  }, message => {
    document.getElementById('loginError').textContent = message;
    resetBusyButtons();
  }, true);
}

function bootstrapApp(attempt) {
  attempt = Number(attempt) || 0;
  clearTimeout(bootstrapRetryTimer);
  document.getElementById('loginError').textContent = state.token ? 'Restoring your session…' : '';
  callServer('api_bootstrap', [], data => {
    Object.assign(state, data);
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('appShell').classList.remove('hidden');
    document.getElementById('companyName').textContent = state.companyName;
    document.getElementById('portalName').textContent = state.appName;
    document.getElementById('topUserName').textContent = state.me.Name;
    setTopAvatar('');
    updateNotificationBadge_(Number(state.unreadNotificationCount || 0));
    startNotificationPolling_();
    renderNav();
    if (state.me.MustChangePassword === 'Yes') {
      navigate('profile');
      setTimeout(() => openChangePasswordModal(true), 250);
    } else navigate('dashboard');
  }, message => {
    // Real session expiry is handled centrally before this callback. For a
    // temporary Apps Script/network failure, keep the token and retry instead
    // of making the employee enter credentials again.
    if (!state.token) return;
    if (attempt < 2) {
      document.getElementById('loginError').textContent = 'Reconnecting to PMS…';
      bootstrapRetryTimer = setTimeout(() => bootstrapApp(attempt + 1), (attempt + 1) * 1200);
      return;
    }
    showLogin('PMS could not reconnect. Your login is still saved; please tap Log in or refresh the page.');
  });
}

function refreshReferenceData_(onDone, onError) {
  callServer('api_bootstrap', [], data => {
    const keys = [
      'me', 'permissions', 'departments', 'activeUsers',
      'managedDepartments', 'reportDepartments', 'taskCategories',
      'ticketCategories', 'priorities', 'companyName', 'appName', 'accessScope',
      'unreadNotificationCount', 'notificationPollSeconds', 'rulePermissions'
    ];
    keys.forEach(key => {
      if (Object.prototype.hasOwnProperty.call(data, key)) state[key] = data[key];
    });
    updateNotificationBadge_(Number(state.unreadNotificationCount || 0));
    if (onDone) onDone(data);
  }, onError);
}

function logout() {
  closeUserMenu();
  if (!state.token) { clearSession(); showLogin(); return; }
  callServer('api_logout', [], () => { clearSession(); showLogin('You have logged out.'); },
    () => { clearSession(); showLogin(); });
}

function clearSession() {
  clearTimeout(bootstrapRetryTimer);
  stopNotificationPolling_();
  removeStoredSession_();
  state.token = '';
  state.me = null;

  // Do not keep employee/editor data from a previous or invalid session.
  state.permissions = {};
  state.activeUsers = [];
  state.managedDepartments = [];
  state.reportDepartments = [];
  state.employeeEditorData = null;
  state.userRows = [];
  state.employeePageLoaded = false;
  state.pageHtmlCache = {};
  state.pageCacheAt = {};
  state.navPrefetchStarted = false;
  state.myTasks = null;
  state.myTaskTab = 'today';
  state.tickets = null;
  state.ticketUsers = [];
  state.profileData = null;
  state.departmentRows = null;
  state.recurringRows = null;
  state.categoryRows = null;
  state.report = null;
  state.teamTasks = null;
  state.teamTaskTab = 'today';
  state.teamTaskFilters = { department: '', userId: '', search: '', fromDate: '', toDate: '', page: 1, pageSize: 100 };
  state.accessScope = null;
  state.notifications = [];
  state.unreadNotificationCount = 0;
  state.recurringWorkspace = null;
  state.recurringTab = 'my';
  state.leaveData = null;
  state.teamTaskSelections = {};
  state.pendingNotificationTicketId = '';
  state.taskWorkspaceScope = 'my';
  state.taskWorkspaceTab = 'today';
  state.rulesData = null;
  state.shiftRosterData = null;
  updateNotificationBadge_(0);
}

function renderNav() {
  const admin = state.me.Role === 'Admin';
  const viewMasters = state.permissions.canViewMasters;
  let html = navItem('dashboard', '▦', 'Dashboard');
  html += '<div class="nav-section">My Work</div>' +
    navItem('tasks', '✓', 'Tasks') +
    navItem('calendar', '▣', 'My Calendar') +
    navItem('tickets', '⚒', 'Help Tickets') +
    navItem('profile', '●', 'My Profile');
  if (state.permissions.canManageTeamShifts) {
    html += '<div class="nav-section">Team Management</div>' + navItem('shiftroster', '◫', 'Shift Roster');
  }
  if (state.permissions.canViewReports) {
    html += '<div class="nav-section">Performance</div>' + navItem('reports', '▥', 'Reports');
  }
  if (viewMasters) {
    html += '<div class="nav-section">' + (admin ? 'Administration' : 'Master View') + '</div>' +
      navItem('users', '♟', 'Employees') +
      navItem('departments', '▤', 'Departments') +
      navItem('categories', '≡', 'Categories');
  }
  if (admin) {
    html += navItem('rules', '⚖', 'Rules & Permissions');
    html += navItem('health', '⚙', 'System Health');
  }
  const nav = document.getElementById('navItems');
  nav.innerHTML = html;
  nav.querySelectorAll('[data-page]').forEach(button => {
    button.addEventListener('click', () => navigate(button.dataset.page));
  });
}

function navItem(page, icon, label) {
  return '<button type="button" class="nav-item' + (state.page === page ? ' active' : '') +
    '" data-page="' + esc(page) + '"><span class="nav-icon">' + icon +
    '</span><span>' + esc(label) + '</span></button>';
}

function cacheCurrentPageHtml_() {
  if (!state.me || !state.page) return;
  const content = document.getElementById('content');
  if (!content) return;
  if (content.querySelector('.spinner') || content.querySelector('.error-panel')) return;
  const html = content.innerHTML;
  if (!html || html.length < 20) return;
  state.pageHtmlCache[state.page] = html;
  state.pageCacheAt[state.page] = Date.now();
}

function navigate(page, initialTab) {
  if (!state.me) { showLogin(); return; }

  // Backward-compatible deep links from Dashboard/notifications.
  if (page === 'mytasks') { page = 'tasks'; initialTab = 'my:' + (initialTab || 'today'); }
  else if (page === 'teamtasks') { page = 'tasks'; initialTab = 'team:' + (initialTab || 'today'); }
  else if (page === 'recurring') { page = 'tasks'; initialTab = initialTab || 'my:today'; }

  const allowed = ['dashboard', 'tasks', 'calendar', 'tickets', 'profile'];
  if (state.permissions.canManageTeamShifts) allowed.push('shiftroster');
  if (state.permissions.canViewReports) allowed.push('reports');
  if (state.permissions.canViewMasters) allowed.push('users', 'departments', 'categories');
  if (state.me.Role === 'Admin') allowed.push('rules', 'health');
  if (allowed.indexOf(page) === -1) page = 'dashboard';

  if (state.page && state.page !== page) cacheCurrentPageHtml_();

  state.page = page;
  renderNav();
  closeSidebarMobile();
  closeUserMenu();
  closeNotificationMenu_();

  const titles = {
    dashboard: 'Dashboard', tasks: 'Tasks', calendar: 'My Calendar', tickets: 'Help Tickets',
    profile: 'My Profile', reports: 'Reports', users: 'Employees', departments: 'Departments',
    categories: 'Categories', shiftroster: 'Shift Roster', rules: 'Rules & Permissions', health: 'System Health'
  };
  document.getElementById('pageTitle').textContent = titles[page] || 'LPPL PMS';

  const renderers = {
    dashboard: renderDashboard, tasks: renderTasksWorkspaceV43_, calendar: renderLeaveCalendarV42_,
    tickets: renderTickets, profile: renderProfile, reports: renderReports, users: renderUsers,
    departments: renderDepartments, categories: renderCategories, shiftroster: renderShiftRosterV46_, rules: renderRulesV44_, health: renderHealth
  };

  if (typeof renderers[page] !== 'function') {
    handleRequestError('Page is unavailable: ' + page, 'navigate');
    return;
  }

  const content = document.getElementById('content');
  const cached = state.pageHtmlCache[page];
  if (cached) {
    content.innerHTML = cached;
    setTimeout(() => renderers[page](initialTab), 20);
  } else {
    content.innerHTML = '<div class="spinner"></div>';
    renderers[page](initialTab);
  }
}

function retryLastLoad() { document.getElementById('content').innerHTML = '<div class="spinner"></div>'; (lastLoadRetry || (() => navigate(state.page)))(); }
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('mobileOverlay').classList.toggle('show'); }
function closeSidebarMobile() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('mobileOverlay').classList.remove('show'); }
function toggleUserMenu() { closeNotificationMenu_(); document.getElementById('userDropdown').classList.toggle('hidden'); }
function closeUserMenu() { document.getElementById('userDropdown').classList.add('hidden'); }


/* Notifications — v4.2 */
function playNotificationSoundV431_() {
  if (!state.notificationSoundEnabled || !state.notificationSoundArmed) return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const gain = ctx.createGain();
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.055, ctx.currentTime + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.16);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.17);
    setTimeout(() => { try { ctx.close(); } catch (ignored) {} }, 350);
  } catch (ignored) {}
}

function updateNotificationBadge_(count) {
  const previous = Math.max(0, Number(state.unreadNotificationCount) || 0);
  const next = Math.max(0, Number(count) || 0);

  // Beep only when a NEW unread notification arrives after initial load.
  if (state.notificationCountInitialized && next > previous) {
    playNotificationSoundV431_();
  }

  state.unreadNotificationCount = next;
  state.notificationCountInitialized = true;

  const badge = document.getElementById('notificationBadge');
  if (!badge) return;
  badge.textContent = next > 99 ? '99+' : String(next);
  badge.classList.toggle('hidden', next < 1);
}
function startNotificationPolling_() {
  stopNotificationPolling_();
  if (!state.token) return;
  const seconds = Math.max(30, Number(state.notificationPollSeconds) || 60);
  notificationPollTimer = setInterval(() => {
    if (document.visibilityState === 'visible' && state.token) refreshNotificationSummary_();
  }, seconds * 1000);
}
function stopNotificationPolling_() {
  if (notificationPollTimer) clearInterval(notificationPollTimer);
  notificationPollTimer = null;
}
function refreshNotificationSummary_() {
  if (!state.token) return;
  callServer('api_getNotificationSummary', [], data => {
    if (data && data.pollSeconds) state.notificationPollSeconds = data.pollSeconds;
    updateNotificationBadge_(data && data.unreadCount || 0);
  }, () => {});
}
function toggleNotificationMenu() {
  closeUserMenu();
  const box = document.getElementById('notificationDropdown');
  if (!box) return;
  if (!box.classList.contains('hidden')) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  loadNotifications_();
}
function closeNotificationMenu_() {
  const box = document.getElementById('notificationDropdown');
  if (box) box.classList.add('hidden');
}
function loadNotifications_() {
  const list = document.getElementById('notificationList');
  if (list) list.innerHTML = '<div class="notification-loading">Loading…</div>';
  callServer('api_getNotifications', [20], data => {
    state.notifications = data.rows || [];
    updateNotificationBadge_(data.unreadCount || 0);
    renderNotificationList_();
  }, () => { if (list) list.innerHTML = '<div class="notification-empty">Unable to load notifications.</div>'; });
}
function renderNotificationList_() {
  const list = document.getElementById('notificationList'); if (!list) return;
  if (!state.notifications.length) { list.innerHTML = '<div class="notification-empty">No notifications yet.</div>'; return; }
  list.innerHTML = state.notifications.map(row =>
    '<button type="button" class="notification-item' + (row.IsRead === 'No' ? ' unread' : '') + '" onclick="openNotification_(' + jsArg(row.NotificationID) + ')">' +
    '<div><b>' + esc(row.Title) + '</b><span>' + fmtDateTime(row.CreatedOn) + '</span></div><p>' + esc(row.Message || '') + '</p></button>'
  ).join('');
}
function markAllNotificationsRead_() {
  callServer('api_markAllNotificationsRead', [], data => {
    (state.notifications || []).forEach(row => row.IsRead = 'Yes');
    updateNotificationBadge_(data.unreadCount || 0); renderNotificationList_();
  });
}
function openNotification_(notificationId) {
  const row = (state.notifications || []).find(item => item.NotificationID === notificationId);
  if (!row) return;
  const go = () => {
    closeNotificationMenu_();
    if (row.ReferenceType === 'TICKET') {
      state.pendingNotificationTicketId = row.ReferenceID;
      navigate('tickets');
      openPendingNotificationTicket_();
    } else if (row.ReferenceType === 'TEAM_TASKS') {
      navigate('tasks', state.permissions.canViewTeamTasks ? 'team:today' : 'my:today');
    } else if (row.ReferenceType === 'RECURRING') {
      navigate('tasks', 'my:today');
    } else if (row.ReferenceType === 'CALENDAR') {
      navigate('calendar');
    }
  };
  if (row.IsRead === 'Yes') { go(); return; }
  callServer('api_markNotificationRead', [notificationId], data => {
    row.IsRead = 'Yes'; updateNotificationBadge_(data.unreadCount || 0); go();
  }, () => go());
}

/* Dashboard */
function renderDashboard() {
  const filters = state.dashboardFilters || {};
  callServer('api_getDashboard', [filters], data => {
    scheduleNavigationPrefetch_();
    if (state.page !== 'dashboard') return;
    const executive = data.mode === 'EXECUTIVE';
    const dateText = new Intl.DateTimeFormat('en-IN',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(new Date(data.businessDate));
    let html = '<div class="dashboard-title-row"><div><h1 class="page-title">Good day, ' + esc(data.user.Name) + '</h1>' +
      '<p class="page-sub">' + esc(data.user.Designation || data.user.Role) + ' · ' + esc(data.user.Department || '') + '</p></div><div class="dashboard-date">' + esc(dateText) + '</div></div>';

    if (executive) {
      const opts=data.filterOptions||{departments:[],employees:[]}, f=data.filters||{};
      state.dashboardEmployeeOptionsV47 = opts.employees || [];
      const employees=(opts.employees||[]).filter(u=>!f.department||u.Department===f.department);
      html += '<div class="card dashboard-filter-card"><div class="dashboard-filter-grid">' +
        '<div><label>Department</label><select id="dashDept" onchange="dashboardDepartmentChangedV47_()"><option value="">Whole Company</option>' +
        (opts.departments||[]).map(d=>'<option value="'+esc(d)+'"'+(d===f.department?' selected':'')+'>'+esc(d)+'</option>').join('')+'</select></div>' +
        '<div><label>Employee</label><select id="dashEmployee"><option value="">All Employees</option>' + employees.map(u=>'<option value="'+esc(u.UserID)+'"'+(String(u.UserID)===String(f.userId||'')?' selected':'')+'>'+esc((u.EmployeeID?u.EmployeeID+' · ':'')+u.Name)+'</option>').join('')+'</select></div>' +
        '<div><label>From</label><input id="dashFrom" type="date" value="'+esc(f.fromDate||'')+'"></div><div><label>To</label><input id="dashTo" type="date" value="'+esc(f.toDate||'')+'"></div>' +
        '<div><button class="btn" onclick="applyDashboardFiltersV47_()">Apply</button></div><div><button class="btn secondary" onclick="resetDashboardFiltersV47_()">Reset</button></div></div></div>' +
        '<div class="dashboard-scope-label">Showing: <b>'+esc(data.scopeLabel||'Whole Company')+'</b></div>' +
        '<div class="cards-row">' + breakdownStatCardV47_('Employees',data.cards.employees) + breakdownStatCardV47_('Departments',data.cards.departments) +
        statCard('Company Overdue',data.cards.overdue,'overdue','tasks','team:overdue') + statCard('Company Not Done',data.cards.notDone,'overdue','tasks','team:notdone') +
        statCard('Open Help Tickets',data.cards.openTickets,'overdue','tickets') + statCard('Completion Rate',data.cards.completionRate+'%','ok','reports') + '</div>' +
        '<div class="dashboard-chart-grid"><div class="card"><h3>Task Status</h3><p class="page-sub">Selected period</p>'+dashboardBarChartV47_(data.taskChart||{},[['completed','Completed'],['pending','Pending'],['overdue','Overdue'],['notDone','Not Done'],['onLeave','On Leave']])+'</div>' +
        '<div class="card"><h3>Help Ticket Status</h3><p class="page-sub">Selected period</p>'+dashboardBarChartV47_(data.ticketChart||{},[['open','Open / Assigned'],['inProgress','In Progress'],['waiting','Waiting'],['resolved','Resolved'],['closed','Closed']])+'</div></div>';
    } else {
      html += '<div class="cards-row">' + statCard('Today',data.counts.today,'','tasks','my:today') + statCard('Completed Today',data.counts.completedToday,'ok','tasks','my:completed') +
        statCard('My Overdue',data.counts.overdue,'overdue','tasks','my:overdue') + statCard('My Not Done',data.counts.notDone,'overdue','tasks','my:notdone') + statCard('On Leave',data.counts.onLeave,'','tasks','my:onleave') + statCard('My Open Tickets',data.counts.openTickets,'','tickets') + '</div>';
      if(data.team){html += '<div class="cards-row">'+statCard('Team Employees',data.team.employees)+statCard('Team Departments',data.team.departments)+statCard('Team Overdue',data.team.overdue,'overdue','tasks','team:overdue')+statCard('Team Not Done',data.team.notDone,'overdue','tasks','team:notdone')+statCard('Team On Leave',data.team.onLeave,'','tasks','team:onleave')+statCard('Completion Rate',data.team.completionRate+'%','ok','reports')+'</div>';}
      html += '<div class="card"><h3>Today\'s Tasks</h3>' + (data.todayTasks.length ? taskTable(data.todayTasks,true) : '<div class="empty-state">Nothing due today.</div>') + '</div>';
    }
    const content=document.getElementById('content');content.innerHTML=html;
    content.querySelectorAll('[data-dashboard-page]').forEach(card=>card.addEventListener('click',()=>navigate(card.dataset.dashboardPage,card.dataset.dashboardTab||undefined)));
  });

function breakdownStatCardV47_(label,obj){obj=obj||{};return '<div class="stat-card breakdown-card"><div class="label">'+esc(label)+'</div><div class="value">'+Number(obj.total||0)+'</div><div class="breakdown-line"><span>Active '+Number(obj.active||0)+'</span><span>Inactive '+Number(obj.inactive||0)+'</span></div></div>';}

function patchCompletedTaskLocalV431_(taskId, remark, hasProof) {
  if (!state.myTasks) return;
  const buckets = ['today','upcoming','overdue','unique'];
  let task = null;
  let sourceBucket = '';
  buckets.some(key => {
    const list = state.myTasks[key] || [];
    const index = list.findIndex(row => String(row.TaskID) === String(taskId));
    if (index === -1) return false;
    task = list.splice(index, 1)[0];
    sourceBucket = key;
    return true;
  });
  if (!task) return;

  task.Status = 'Completed';
  task.Remark = remark || '';
  task.CompletedOn = new Date().toISOString();
  task.CanComplete = false;
  task.HasProof = !!hasProof || !!task.HasProof;
  task.SubmissionResult = task.SubmissionResult || 'Completed';

  state.myTasks.completed = state.myTasks.completed || [];
  state.myTasks.completed.unshift(task);

  if (state.myTasks.counts) {
    if (sourceBucket && sourceBucket !== 'unique') {
      state.myTasks.counts[sourceBucket] = Math.max(0, Number(state.myTasks.counts[sourceBucket] || 0) - 1);
    }
    state.myTasks.counts.completed = Number(state.myTasks.counts.completed || 0) + 1;
  }
}

function submitCompleteTask(taskId) {
  const button = document.getElementById('taskCompleteBtn');
  const remark = document.getElementById('taskRemark').value;
  setBusy(button, 'Saving…');

  const finish = fileData => callServer('api_completeTaskV42', [taskId, remark, fileData], () => {
    patchCompletedTaskLocalV431_(taskId, remark, !!fileData);
    closeModal();
    toast('Task completed');

    // Keep the current scope and tab; the completed row leaves this view.
    // Immediate local redraw — no spinner / page refresh.
    if (state.page === 'tasks') renderTasksWorkspaceFromStateV43_();

    // Silent server reconciliation keeps Google Sheet as source of truth.
    setTimeout(() => loadMyTaskWorkspaceV43_(true), 250);
  });

  const input = document.getElementById('taskProof');
  if (input && input.files[0]) fileToBase64(input.files[0], finish);
  else if (input) { toast('Proof is required for this task.', true); resetBusyButtons(); }
  else finish(null);
}

/* Tickets */
function renderTickets(activeTab) {
  if (activeTab === 'myRaised') {
    state.ticketScope = 'mine'; state.ticketOwner = 'created'; state.ticketStatus = 'all';
  } else if (activeTab === 'inProgress') state.ticketStatus = 'inprogress';
  else if (activeTab === 'closed') state.ticketStatus = 'resolved';
  else if (activeTab === 'assigned') state.ticketStatus = 'open';

  if (state.tickets) {
    renderTicketWorkspace_();
    // Refresh current ticket data without blocking page navigation.
    callServer('api_getMyTickets', [], data => {
      state.tickets = data;
      state.ticketUsers = data.ticketUsers || [];
      if (!data.canViewTeam) state.ticketScope = 'mine';
      if (state.page === 'tickets') {
        renderTicketWorkspace_();
        openPendingNotificationTicket_();
      }
    }, () => {});
    return;
  }

  callServer('api_getMyTickets', [], data => {
    state.tickets = data;
    state.ticketUsers = data.ticketUsers || [];
    if (!data.canViewTeam) state.ticketScope = 'mine';
    if (state.page === 'tickets') {
      renderTicketWorkspace_();
      openPendingNotificationTicket_();
    }
  });
}
function openPendingNotificationTicket_() {
  const ticketId = String(state.pendingNotificationTicketId || '');
  if (!ticketId || state.page !== 'tickets' || !state.tickets) return;
  const ticket = findTicket(ticketId);
  if (!ticket) return; // fresh ticket data may still be loading.
  state.pendingNotificationTicketId = '';
  openTicket(ticketId);
}
function renderTicketWorkspace_() {
  const data = state.tickets || { mine: [], team: [], canViewTeam: false };
  const baseRows = state.ticketScope === 'team' ? data.team : data.mine;
  const ownerCounts = {
    all: baseRows.length,
    assigned: baseRows.filter(row => row.IsAssignedToMe).length,
    created: baseRows.filter(row => row.IsCreatedByMe).length,
    unassigned: baseRows.filter(row => row.IsUnassigned).length
  };
  const ownerRows = filterTicketOwner_(baseRows);
  const statusTabs = [
    ['open','Open / Assigned'],['inprogress','In Progress'],['waiting','Waiting / Hold'],
    ['resolved','Resolved'],['closed','Closed'],['all','All']
  ];
  const statusCounts = {};
  statusTabs.forEach(tab => { statusCounts[tab[0]] = filterTicketStatus_(ownerRows, tab[0]).length; });

  let html = '<div class="ticket-heading"><div><h1 class="page-title">Help Tickets</h1>' +
    '<p class="page-sub">Raise, assign, discuss, resolve and close employee issues.</p></div>' +
    '<button class="btn" onclick="openCreateTicket()">+ New Ticket</button></div>' +
    '<div class="tabs ticket-scope-tabs"><button type="button" class="tab' + (state.ticketScope === 'mine' ? ' active' : '') +
    '" onclick="setTicketScope_(\'mine\')">My Help Tickets (' + data.mine.length + ')</button>' +
    (data.canViewTeam ? '<button type="button" class="tab' + (state.ticketScope === 'team' ? ' active' : '') +
      '" onclick="setTicketScope_(\'team\')">Team Help Tickets (' + data.team.length + ')</button>' : '') + '</div>' +
    '<div class="ticket-chip-row">' +
    ticketChip_('all','All',ownerCounts.all,state.ticketOwner,'owner') +
    ticketChip_('assigned','Assigned to Me',ownerCounts.assigned,state.ticketOwner,'owner') +
    ticketChip_('created','Raised by Me',ownerCounts.created,state.ticketOwner,'owner') +
    (state.ticketScope === 'team' ? ticketChip_('unassigned','Unassigned',ownerCounts.unassigned,state.ticketOwner,'owner') : '') +
    '</div>' + ticketFilterPanel_(baseRows) + '<div class="ticket-chip-row status-row">';
  statusTabs.forEach(tab => { html += ticketChip_(tab[0],tab[1],statusCounts[tab[0]],state.ticketStatus,'status'); });
  html += '</div><div id="ticketTable"></div>';
  document.getElementById('content').innerHTML = html;
  restoreTicketFilters_();
  renderTicketResults_();
}
function ticketChip_(key, label, count, selected, kind) {
  return '<button type="button" class="ticket-chip' + (key === selected ? ' active' : '') + '" onclick="' +
    (kind === 'owner' ? 'setTicketOwner_' : 'setTicketStatus_') + '(' + jsArg(key) + ')">' + esc(label) +
    ' <span>' + count + '</span></button>';
}
function setTicketScope_(scope) {
  captureTicketFilters_(); state.ticketScope = scope; state.ticketOwner = 'all'; renderTicketWorkspace_();
}
function setTicketOwner_(owner) {
  captureTicketFilters_(); state.ticketOwner = owner; renderTicketWorkspace_();
}
function setTicketStatus_(status) {
  captureTicketFilters_(); state.ticketStatus = status; renderTicketWorkspace_();
}
function filterTicketOwner_(rows) {
  if (state.ticketOwner === 'assigned') return rows.filter(row => row.IsAssignedToMe);
  if (state.ticketOwner === 'created') return rows.filter(row => row.IsCreatedByMe);
  if (state.ticketOwner === 'unassigned') return rows.filter(row => row.IsUnassigned);
  return rows.slice();
}
function filterTicketStatus_(rows, status) {
  if (status === 'open') return rows.filter(row => ['Open','Assigned'].indexOf(row.Status) !== -1);
  if (status === 'inprogress') return rows.filter(row => row.Status === 'In Progress');
  if (status === 'waiting') return rows.filter(row => row.Status === 'Waiting');
  if (status === 'resolved') return rows.filter(row => row.Status === 'Resolved');
  if (status === 'closed') return rows.filter(row => row.Status === 'Closed');
  return rows.slice();
}

    ? state.tickets.scopeDepartments.slice()

    ? scopedDepartments
    : uniqueClient(rows.filter(row => row.Department), 'Department').map(row => row.Department)).sort();
  const creators = uniqueClient(rows.filter(row => row.CreatedByUserID), 'CreatedByUserID')
    .sort((a,b) => String(a.CreatedByEmployeeID).localeCompare(String(b.CreatedByEmployeeID)));
  const departmentOptions = departments.map(name => ({ value: name, label: name }));
  const creatorOptions = creators.map(row => ({
    value: String(row.CreatedByUserID),
    label: (row.CreatedByEmployeeID ? row.CreatedByEmployeeID + ' · ' : '') + row.CreatedByName
  }));
  const categoryOptions = state.ticketCategories.map(name => ({ value: name, label: name }));
  return '<div class="card ticket-filters"><div class="ticket-filter-grid">' +
    multiTicketFilterHtml_('ticketDeptFilter','Department',departmentOptions,'All Departments') +
    multiTicketFilterHtml_('ticketCreatorFilter','Raised By',creatorOptions,'All Employees') +

function submitTicket() {

      DueDate: ticket.DueDate,

      ResolvedOn: '',
      Status: 'Assigned',
      AssignedToUserID: ticket.AssignedToUserID,
      AssignedEmployeeID: doer ? doer.EmployeeID : '',
      AssignedToName: doer ? doer.Name : '',

function ticketFileData_(blob, fileName, audioFile) {
  return new Promise((resolve, reject) => {
    if (blob.size > 10 * 1024 * 1024) { reject(new Error((fileName || 'File') + ' is larger than 10 MB.')); return; }
    const reader = new FileReader();
    reader.onload = () => resolve({
      base64: String(reader.result).split(',')[1],
      mimeType: audioFile ? ticketAudioMime_(blob.type, fileName) : String(blob.type || 'application/octet-stream').split(';')[0],
      fileName: fileName || 'upload'
    });
    reader.onerror = () => reject(new Error('The file could not be read.'));
    reader.readAsDataURL(blob);
  });
}
function ticketAudioMime_(mimeType, fileName) {
  const current = String(mimeType || '').split(';')[0].toLowerCase();
  if (current.indexOf('audio/') === 0) return current;
  const extension = String(fileName || '').toLowerCase().split('.').pop();
  return ({ webm:'audio/webm', m4a:'audio/mp4', mp4:'audio/mp4', mp3:'audio/mpeg',
    ogg:'audio/ogg', oga:'audio/ogg', wav:'audio/wav', aac:'audio/aac',
    '3gp':'audio/3gpp', amr:'audio/amr' })[extension] || current;
}
function ticketVoiceFileName_() {
  const type = ticketVoiceBlob ? String(ticketVoiceBlob.type || '') : '';
  if (type.indexOf('mp4') !== -1) return 'voice-note.m4a';
  if (type.indexOf('ogg') !== -1) return 'voice-note.ogg';
  if (type.indexOf('wav') !== -1) return 'voice-note.wav';
  return 'voice-note.webm';
}
function startTicketVoice_() {
  // Apps Script HTML runs in a sandboxed iframe, where the host often blocks
  // microphone access before the browser can ask the user for permission.
  // Use the device's audio picker/recorder instead of showing a misleading
  // "permission was not granted" error.
  if (window !== window.top) {
    const input = document.getElementById('tkVoiceFile');
    if (input) input.click();
    else toast('Use the audio file option below to attach a voice note.', true);
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
    const input = document.getElementById('tkVoiceFile');
    if (input) input.click();
    else toast('Use the audio file option below to attach a voice note.', true);
    return;
  }
  clearTicketVoice_(false);
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    ticketVoiceStream = stream;
    ticketVoiceChunks = [];
    ticketVoiceRecorder = new MediaRecorder(stream);
    ticketVoiceRecorder.ondataavailable = event => { if (event.data && event.data.size) ticketVoiceChunks.push(event.data); };
    ticketVoiceRecorder.onstop = () => {
      ticketVoiceBlob = new Blob(ticketVoiceChunks, { type: ticketVoiceRecorder.mimeType || 'audio/webm' });
      stopTicketVoiceTracks_();
      updateTicketVoiceUi_('Voice note recorded (' + Math.max(1, Math.round(ticketVoiceBlob.size / 1024)) + ' KB)');
    };
    ticketVoiceRecorder.start();
    updateTicketVoiceUi_('Recording…', true);
  }).catch(() => {
    toast('This page cannot access the microphone. Choose a saved audio recording or use the Android app to record.', true);
    const input = document.getElementById('tkVoiceFile');
    if (input) input.click();
  });
}
function stopTicketVoice_() {

}

function clearTicketVoice_(keepFileInput) {
  if (ticketVoiceRecorder && ticketVoiceRecorder.state === 'recording') ticketVoiceRecorder.stop();
  stopTicketVoiceTracks_();
  ticketVoiceRecorder = null;
  ticketVoiceChunks = [];

function cleanupTicketVoice_() {
  if (ticketVoiceRecorder && ticketVoiceRecorder.state === 'recording') {
    ticketVoiceRecorder.ondataavailable = null;
    ticketVoiceRecorder.onstop = null;
    try { ticketVoiceRecorder.stop(); } catch (ignored) {}

function stopTicketVoiceTracks_() {

function openServerFile(file, targetWindow) {
  const bytes = Uint8Array.from(atob(file.base64), char => char.charCodeAt(0));

  if (targetWindow) targetWindow.location.href = url;
  else window.open(url, '_blank');
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/* Fast navigation prefetch */
function prefetchServer_(fnName, args, onSuccess) {
  if (!state.token) return;
  const finalArgs = (args || []).slice();
  finalArgs.unshift(state.token);

  try {
    const runner = google.script.run
      .withSuccessHandler(response => {
        if (!response || response.ok === false) return;
        try { if (onSuccess) onSuccess(response.data); } catch (ignored) {}
      })
      .withFailureHandler(() => {});
    if (runner[fnName]) runner[fnName].apply(runner, finalArgs);
  } catch (ignored) {}
}

function scheduleNavigationPrefetch_() {
  if (!state.token || !state.me || state.navPrefetchStarted) return;
  state.navPrefetchStarted = true;

  // Warm the pages employees use most often. These run only after Dashboard
  // has already rendered, so login/dashboard is not blocked.
  if (state.permissions.canViewMasters) {
    setTimeout(() => {
      if (!state.employeePageLoaded) {
        prefetchServer_('api_getEmployeePageData', [], data => {
          applyEmployeePageData_(data);
        });
      }
    }, 250);
  }

  setTimeout(() => {
    if (!state.myTasks) {
      prefetchServer_('api_getMyTaskWorkspaceV43', [], data => {
        state.myTasks = data;
      });
    }
  }, 850);

  if (state.permissions.canViewTeamTasks) {
    setTimeout(() => {
      if (!state.teamTasks) {
        prefetchServer_('api_getTeamTaskWorkspaceV43', [{
          tab: state.teamTaskTab || 'today',
          page: 1,
          pageSize: 100
        }], data => {
          state.teamTasks = data;
        });
      }
    }, 1150);
  }

  setTimeout(() => {
    if (!state.tickets) {
      prefetchServer_('api_getMyTickets', [], data => {
        state.tickets = data;
        state.ticketUsers = data && data.ticketUsers || [];
        if (data && !data.canViewTeam) state.ticketScope = 'mine';
      });
    }
  }, 1450);

  if (state.permissions.canViewMasters) {
    setTimeout(() => {
      if (!Array.isArray(state.departmentRows)) {
        prefetchServer_('api_listDepartments', [], rows => {
          state.departmentRows = rows || [];
          state.departments = state.departmentRows.filter(row => row.Status === 'Active');
        });
      }
    }, 2050);

    setTimeout(() => {
      if (!Array.isArray(state.categoryRows)) {
        prefetchServer_('api_listCategoriesV46', [], rows => {
          state.categoryRows = rows || [];
        });
      }
    }, 3250);
  }

  setTimeout(() => {
    if (!state.profileData) {
      prefetchServer_('api_getMyProfile', [], profile => {
        state.profileData = profile;
      });
    }
  }, 3850);

  if (state.permissions.canManageTeamShifts) {
    setTimeout(() => {
      if (!state.shiftRosterData) {
        prefetchServer_('api_getShiftRosterV46', [state.shiftRosterFilters || {}], data => {
          state.shiftRosterData = data;
        });
      }
    }, 4300);
  }
}

function applyEmployeePageData_(data) {
  data = data || {};
  state.userRows = data.users || [];
  state.activeUsers = state.userRows.filter(user => user.Status === 'Active');
  state.employeeEditorData = data.editor || state.employeeEditorData || null;
  state.employeePageLoaded = true;
  state.employeeLastSyncAt = Date.now();

  if (state.employeeEditorData) syncEmployeeEditorUsersFromRows_();
}

/* Dynamic page synchronization */
function silentRefreshCurrentPage_() {
  if (!state.token || !state.me || document.visibilityState === 'hidden') return;
  refreshNotificationSummary_();

  // Avoid duplicate calls when focus + visibilitychange fire together.
  const now = Date.now();
  if (state.page === 'users') {
    if (now - Number(state.employeeLastSyncAt || 0) < 8000) return;
    silentSyncEmployees_();
  } else if (state.page === 'tasks') {
    if (state.taskWorkspaceScope === 'team' && state.permissions.canViewTeamTasks) loadTeamTasks_(true);
    else loadMyTaskWorkspaceV43_(true);
  } else if (state.page === 'tickets') {
    callServer('api_getMyTickets', [], data => {
      state.tickets = data;
      state.ticketUsers = data && data.ticketUsers || [];
      if (data && !data.canViewTeam) state.ticketScope = 'mine';
      if (state.page === 'tickets' && !document.getElementById('modalBackdrop')) renderTicketWorkspace_();
    }, () => {});
  } else if (state.page === 'calendar') {
    state.leaveData = null; renderLeaveCalendarV42_(state.leaveMonth);
  } else if (state.page === 'dashboard') {
    renderDashboard();
  }
}

function silentSyncEmployees_(forceRender) {
  if (!state.token || !state.me || !state.permissions.canViewMasters) return;
  state.employeeLastSyncAt = Date.now();

  callServer('api_getEmployeePageData', [], data => {
    applyEmployeePageData_(data);

    if (state.page === 'users' && !document.getElementById('modalBackdrop')) {
      // Local redraw only; no browser refresh and no blocking spinner.
      renderEmployeeWorkspace_();
    } else if (forceRender && state.page === 'users') {
      applyEmployeeFilters_(true);
    }
  }, () => {}, false);
}

function syncEmployeeEditorUsersFromRows_() {
  if (!state.employeeEditorData) return;
  state.employeeEditorData.users = (state.userRows || [])
    .filter(row => row.Status === 'Active')
    .map(row => ({
      UserID: row.UserID,
      EmployeeID: row.EmployeeID,
      Name: row.Name,
      Email: row.Email || '',
      Department: row.Department,
      Designation: row.Designation
    }))
    .sort((a, b) => String(a.Name || '').localeCompare(String(b.Name || '')));
}

function managerDepartmentNamesFromIds_(ids) {
  const editor = state.employeeEditorData || {};
  const wanted = {};
  (ids || []).forEach(id => wanted[String(id)] = true);
  return (editor.departments || [])
    .filter(row => wanted[String(row.DeptID)])
    .map(row => row.DepartmentName);
}

function patchEmployeeStateAfterSave_(input, result, editing) {
  const rows = state.userRows || (state.userRows = []);
  let row = editing
    ? rows.find(item => String(item.UserID) === String(input.UserID))
    : null;

  const manager = (state.employeeEditorData && state.employeeEditorData.users || state.activeUsers || [])
    .find(item => String(item.UserID) === String(input.ManagerUserID || ''));

  const next = {
    UserID: result && result.userId ? result.userId : (row ? row.UserID : ''),
    EmployeeID: input.EmployeeID,
    Name: input.Name,
    Email: input.Email || '',
    PhoneNumber: input.PhoneNumber || '',
    Department: input.Department,
    Designation: input.Designation,
    Role: input.Role,
    ManagerUserID: input.ManagerUserID || '',
    ManagerEmail: manager ? (manager.Email || '') : (row ? row.ManagerEmail || '' : ''),
    IsManager: editing ? input.IsManager : 'No',
    ManagerDepartmentIDs: editing && input.IsManager === 'Yes' ? (input.ManagerDepartmentIDs || []).slice() : [],
    ManagerDepartmentNames: editing && input.IsManager === 'Yes'
      ? managerDepartmentNamesFromIds_(input.ManagerDepartmentIDs || [])
      : [],
    PasswordStatus: 'Set',
    Status: row ? row.Status : 'Active',
    LastLoginOn: row ? row.LastLoginOn || '' : ''
  };

  if (row) Object.assign(row, next);
  else rows.push(next);

  state.activeUsers = rows.filter(item => item.Status === 'Active');
  syncEmployeeEditorUsersFromRows_();
}

function patchEmployeeStatusLocal_(userId, status) {
  const row = (state.userRows || []).find(item => String(item.UserID) === String(userId));
  if (row) row.Status = status;
  state.activeUsers = (state.userRows || []).filter(item => item.Status === 'Active');
  syncEmployeeEditorUsersFromRows_();
}

function applyEmployeeFilters_(skipCapture) {
  if (!skipCapture) captureEmployeeFilters_();
  const filters = state.employeeFilters || {};
  let rows = (state.userRows || []).slice();

  if (filters.department) rows = rows.filter(row => row.Department === filters.department);
  if (filters.role) rows = rows.filter(row => employeeDisplayRole_(row) === filters.role);
  if (filters.status) rows = rows.filter(row => row.Status === filters.status);
  if (filters.search) {
    const query = String(filters.search).toLowerCase();
    rows = rows.filter(row => [
      row.EmployeeID, row.Name
    ].join(' ').toLowerCase().indexOf(query) !== -1);
  }

  if (filters.reportsTo) {
    const reportsQuery = String(filters.reportsTo).toLowerCase();
    rows = rows.filter(row =>
      employeeManagerLabel_(row).toLowerCase().indexOf(reportsQuery) !== -1
    );
  }

  const box = document.getElementById('employeeTable');
  if (box) box.innerHTML = employeeTable_(rows);
}

function saveUser() {
  const userId = val('uUserId');
  const editing = !!userId;
  const employeeId = val('uEmployeeId');
  const name = val('uName');
  const department = val('uDepartment');
  const designation = val('uDesignation');
  const role = val('uRole');

  if (!employeeId || !name || !department || !designation || !role) {
    toast('Employee ID, name, primary department, designation and role are required.', true);
    return;
  }

  if (!editing) {
    if (!val('uPassword')) { toast('Password is required for a new employee.', true); return; }
    if (val('uPassword') !== val('uConfirmPassword')) { toast('Passwords do not match.', true); return; }
  }

  const original = editing ? (state.userRows || []).find(row => String(row.UserID) === userId) : null;
  const input = {
    UserID: userId,
    EmployeeID: employeeId,
    Name: name,
    Email: val('uEmail'),
    PhoneNumber: val('uPhoneNumber'),
    Department: department,
    Designation: designation,
    ManagerUserID: val('uManagerUserId'),
    Role: role,
    Status: original ? original.Status : 'Active',
    IsManager: editing && document.getElementById('uIsManager') && document.getElementById('uIsManager').checked ? 'Yes' : 'No',
    ManagerDepartmentIDs: editing ? selectedManagerDepartmentIds_() : [],
    Password: editing ? '' : val('uPassword')
  };

  const button = document.getElementById('employeeSaveBtn');
  setBusy(button, editing ? 'Saving…' : 'Creating…');

  const send = profileFile => {
    callServer('api_saveUser', [input, profileFile], result => {
      // Update the on-screen employee data immediately from the values that
      // the server has just accepted. Do not make the user wait for another
      // bootstrap + list + editor-data round trip.
      patchEmployeeStateAfterSave_(input, result, editing);
      closeModal();

      // 03_Users.gs intentionally increments SessionVersion when an employee
      // record is edited. Editing your own access therefore requires re-login.
      const editedCurrentUser = editing && state.me &&
        String(userId) === String(state.me.UserID);

      if (editedCurrentUser) {
        clearSession();
        showLogin('Your employee/access record was updated successfully. Please log in again.');
        return;
      }

      renderEmployeeWorkspace_();
      toast((editing ? 'Employee updated: ' : 'Employee created: ') + result.employeeId);

      // Reconcile silently with Google Sheets in the background. This never
      // blocks the UI and requires no browser refresh.
      setTimeout(() => silentSyncEmployees_(), 400);
    });
  };

  const photoInput = document.getElementById('uProfilePhoto');
  if (photoInput && photoInput.files[0]) {
    const file = photoInput.files[0];
    if (file.size > 2 * 1024 * 1024) {
      toast('Profile photo must be 2 MB or smaller.', true); resetBusyButtons(); return;
    }
    fileToBase64(file, send);
  } else send(null);
}

function renderDeactivateEmployeeModal_(data) {
  const impact = data.impact || {};
  const replacements = data.replacements || [];
  const hasWork = Number(impact.totalTransferable || 0) > 0;
  const replacementOptions = '<option value="">Select replacement employee</option>' +
    replacements.map(row => '<option value="' + esc(row.UserID) + '">' +
      esc((row.EmployeeID ? row.EmployeeID + ' · ' : '') + row.Name) + '</option>').join('');

  let html = '<div class="employee-modal-heading"><div><h2>Make Employee Inactive</h2><p>' +
    esc(data.user.EmployeeID + ' · ' + data.user.Name) + '</p></div><span class="badge overdue">Deactivate</span></div>' +
    '<div class="deactivation-warning">The employee’s login will be disabled, but historical completed work will remain unchanged.</div>' +
    '<div class="deactivation-impact-grid">' +
      deactivationImpactCard_('Future Recurring Tasks', impact.activeTaskMasters || 0) +
      deactivationImpactCard_('Pending / Overdue Tasks', impact.pendingTasks || 0) +
      deactivationImpactCard_('Open Help Tickets', impact.openTickets || 0) +
    '</div>';

  if (hasWork) {
    if (!replacements.length) {
      html += '<div class="error-panel compact-error"><b>No replacement is available.</b><p>Create or activate another employee in ' +
        esc(data.user.Department) + ' before deactivating this employee.</p></div>';
    } else {
      html += '<div class="employee-form-section"><div class="employee-section-title">Transfer Responsibilities</div>' +
        '<label class="employee-manager-toggle"><input id="useSameReplacement" type="checkbox" onchange="toggleSameReplacement_()">' +
        '<span><b>Use one replacement for everything</b><small>Replacement must be an active employee of the same primary department.</small></span></label>' +
        '<div id="sameReplacementBox" class="hidden"><label>Replacement Employee</label><select id="sameReplacement" onchange="applySameReplacement_()">' +
        replacementOptions + '</select></div>' +
        (impact.activeTaskMasters ? '<div class="transfer-row"><div><b>Future recurring tasks</b><small>' +
          impact.activeTaskMasters + ' task master(s)</small></div><select id="taskMasterReplacement">' + replacementOptions + '</select></div>' : '') +
        (impact.pendingTasks ? '<div class="transfer-row"><div><b>Pending / overdue tasks</b><small>' +
          impact.pendingTasks + ' task(s)</small></div><select id="taskReplacement">' + replacementOptions + '</select></div>' : '') +
        (impact.openTickets ? '<div class="transfer-row"><div><b>Open / in-progress help tickets</b><small>' +
          impact.openTickets + ' ticket(s)</small></div><select id="ticketReplacement">' + replacementOptions + '</select></div>' : '') +
        '</div>';
    }
  } else {
    html += '<div class="readonly-note">No future/pending responsibilities need transfer. The employee can be made inactive directly.</div>';
  }

  html += '<div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button>' +
    '<button id="deactivateEmployeeBtn" class="btn danger" ' +
    (hasWork && !replacements.length ? 'disabled ' : '') + 'onclick="submitDeactivateEmployee_(' + jsArg(data.user.UserID) + ')">' +
    (hasWork ? 'Transfer & Make Inactive' : 'Make Inactive') + '</button></div>';
  openModal(html, true);
}

function openEmployeeImportModal() {

    '<p>Create or update employees in bulk using Excel/CSV or the Employee_Import sheet.</p></div></div>' +

    '<div class="actions left"><button id="employeePreviewFileBtn" class="btn" onclick="previewEmployeeImportFile_()">Preview File</button></div></div>' +

function downloadEmployeeImportTemplate_() {
  callServer('api_getEmployeeImportTemplate', [], csv => {
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'LPPL_PMS_Employee_Import_Template.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
}

function employeeImportFileData_(file) {
  return new Promise((resolve, reject) => {
    if (!file) { reject(new Error('Select an Excel or CSV file.')); return; }
    if (file.size > 5 * 1024 * 1024) { reject(new Error('Employee import file must be 5 MB or smaller.')); return; }
    const reader = new FileReader();
    reader.onload = () => resolve({
      base64: String(reader.result).split(',')[1],
      mimeType: file.type || 'application/octet-stream',
      name: file.name
    });
    reader.onerror = () => reject(new Error('The import file could not be read.'));
    reader.readAsDataURL(file);
  });
}

function previewEmployeeImportFile_() {
  const input = document.getElementById('employeeImportFile');
  const file = input && input.files[0];
  setBusy(document.getElementById('employeePreviewFileBtn'), 'Reading…');
  employeeImportFileData_(file).then(data => {
    state.employeeImportFileData = data;
    callServer('api_previewEmployeeImport', [data], preview => {
      state.employeeImportPreview = preview;
      renderEmployeeImportPreview_(preview, 'file');
      resetBusyButtons();
    });
  }).catch(error => {
    toast(error.message || String(error), true);
    resetBusyButtons();
  });
}

function previewEmployeeImportSheet_() {
  const box = document.getElementById('employeeImportPreviewBox');
  if (box) box.innerHTML = '<div class="spinner"></div>';
  callServer('api_previewEmployeeImportSheet', [], preview => {
    state.employeeImportPreview = preview;
    renderEmployeeImportPreview_(preview, 'sheet');
  });
}

function renderEmployeeImportPreview_(preview, source) {
  const box = document.getElementById('employeeImportPreviewBox');
  if (!box) return;
  const rows = preview.rows || [];
  let html = '<div class="employee-import-summary"><div><span>Total</span><b>' + preview.total + '</b></div>' +
    '<div><span>Create</span><b>' + preview.create + '</b></div><div><span>Update</span><b>' + preview.update + '</b></div>' +
    '<div><span>Unchanged</span><b>' + preview.unchanged + '</b></div><div class="' + (preview.errors ? 'has-errors' : '') +
    '"><span>Errors</span><b>' + preview.errors + '</b></div></div>' +
    (preview.truncated ? '<div class="readonly-note">Preview shows the first 500 rows.</div>' : '') +
    '<div class="import-preview-table"><table class="responsive"><thead><tr><th>Row</th><th>Employee ID</th><th>Name</th>' +
    '<th>Department</th><th>Designation</th><th>Role</th><th>Manager?</th><th>Action</th><th>Validation</th></tr></thead><tbody>' +
    rows.map(row => '<tr><td data-label="Row">' + esc(row.Row) + '</td><td data-label="Employee ID">' + esc(row.EmployeeID) +
      '</td><td data-label="Name">' + esc(row.Name) + '</td><td data-label="Department">' + esc(row.Department) +
      '</td><td data-label="Designation">' + esc(row.Designation) + '</td><td data-label="Role">' + esc(row.Role) +
      '</td><td data-label="Manager?">' + esc(row.IsManager || 'No') +
      '</td><td data-label="Action"><span class="badge ' + importActionClass_(row.Action) + '">' + esc(row.Action) +
      '</span></td><td data-label="Validation">' +
      ((row.Errors || []).length ? '<div class="import-error-text">' + (row.Errors || []).map(esc).join('<br>') + '</div>' :
        ((row.Warnings || []).length ? '<div class="import-warning-text">' + (row.Warnings || []).map(esc).join('<br>') + '</div>' :
        '<span class="import-ok-text">Ready</span>')) + '</td></tr>').join('') + '</tbody></table></div>';

  if (preview.errors) {
    html += '<div class="deactivation-warning"><b>Import not applied.</b> Fix the ' + preview.errors +
      ' invalid row(s), then preview again. No employee has been changed.</div>';
  } else {
    html += '<div class="actions"><button id="employeeCommitImportBtn" class="btn" onclick="' +
      (source === 'file' ? 'commitEmployeeImportFile_()' : 'commitEmployeeImportSheet_()') + '">' +
      (preview.create || preview.update ? 'Apply Import' : 'No Changes Needed') + '</button></div>';
  }
  box.innerHTML = html;
  const button = document.getElementById('employeeCommitImportBtn');
  if (button && !preview.create && !preview.update) button.disabled = true;
}

function importActionClass_(action) {
  if (action === 'CREATE') return 'active';
  if (action === 'UPDATE') return 'assigned';
  if (action === 'UNCHANGED') return 'inactive';
  return 'overdue';
}

function commitEmployeeImportFile_() {
  if (!state.employeeImportFileData) { toast('Preview the file first.', true); return; }
  setBusy(document.getElementById('employeeCommitImportBtn'), 'Importing…');
  callServer('api_commitEmployeeImport', [state.employeeImportFileData], result => finishEmployeeImport_(result));
}

function commitEmployeeImportSheet_() {
  setBusy(document.getElementById('employeeCommitImportBtn'), 'Importing…');
  callServer('api_commitEmployeeImportSheet', [], result => finishEmployeeImport_(result));
}

function finishEmployeeImport_(result) {
  closeModal();
  toast('Employee import complete: ' + result.created + ' created, ' + result.updated + ' updated, ' +
    result.unchanged + ' unchanged. Updating employee list…');

  // A bulk import can change many rows, so one optimized employee-page sync is
  // necessary. It is automatic; the user never refreshes the browser.
  callServer('api_getEmployeePageData', [], data => {
    applyEmployeePageData_(data);
    if (state.page === 'users') renderEmployeeWorkspace_();
  });
}

      '<div class="cards-row">' + statCard('Overall', data.allOk ? 'Healthy' : 'Needs Attention', data.allOk ? 'ok' : 'overdue') + '</div>' +
      '<div class="card"><h3>Checks</h3><table><tbody>' + data.checks.map(check =>
        '<tr><td>' + esc(check.name) + '</td><td><span class="badge ' + (check.ok ? 'active' : 'overdue') + '">' + (check.ok ? 'OK' : 'Missing') + '</span></td></tr>').join('') +
      '</tbody></table></div><div class="card"><button class="btn" onclick="repairSystem()">Repair System</button> ' +
      '<button class="btn secondary" onclick="runTaskGeneration()">Run Task Generation</button></div>' +
      '<div class="card"><h3>Recent Errors</h3>' + (data.recentErrors.length ? reportTable(data.recentErrors) : '<div class="empty-state">No recent errors.</div>') + '</div>';
    document.getElementById('content').innerHTML = html;
  });
}
function repairSystem() { callServer('api_repairSystem', [], () => { toast('Repair complete'); renderHealth(); }); }
function runTaskGeneration() { callServer('api_runV42MaintenanceNow', [], () => { toast('Task generation and status maintenance complete'); renderHealth(); }); }

/* Common helpers */
function openModal(html, wide) {
  closeModal();
  const backdrop = document.createElement('div');
  backdrop.id = 'modalBackdrop'; backdrop.className = 'modal-backdrop';
  backdrop.onclick = event => { if (event.target === backdrop) closeModal(); };
  backdrop.innerHTML = '<div class="modal' + (wide ? ' wide' : '') + '">' + html + '</div>';
  document.body.appendChild(backdrop);
}
function closeModal() {
  cleanupTicketVoice_();
  const modal = document.getElementById('modalBackdrop');
  if (modal) modal.remove();
}
function selectHtml(id, label, options, selected, extra) {
  return '<label>' + esc(label) + '</label><select id="' + id + '" ' + (extra || '') + '>' +
    options.map(option => '<option value="' + esc(option) + '"' + (String(option) === String(selected || '') ? ' selected' : '') + '>' +
      esc(option || 'Select') + '</option>').join('') + '</select>';
}
function optionObjectSelect(id, label, rows, valueKey, labelFn, selected, allowBlank) {
  return '<label>' + esc(label) + '</label><select id="' + id + '">' + (allowBlank ? '<option value="">Not assigned</option>' : '') +
    rows.map(row => '<option value="' + esc(row[valueKey]) + '"' + (String(row[valueKey]) === String(selected || '') ? ' selected' : '') + '>' +
      esc(labelFn(row)) + '</option>').join('') + '</select>';
}
function fileToBase64(file, callback) {
  if (file.size > 10 * 1024 * 1024) { toast('File is larger than 10 MB.', true); resetBusyButtons(); return; }
  const reader = new FileReader();
  reader.onload = () => callback({ base64: String(reader.result).split(',')[1], mimeType: file.type || 'application/octet-stream', fileName: file.name });
  reader.onerror = () => { toast('The file could not be read.', true); resetBusyButtons(); };
  reader.readAsDataURL(file);
}
function setTopAvatar(dataUri) {
  const box = document.getElementById('topAvatar');
  if (!box || !state.me) return;
  box.outerHTML = dataUri ? '<img id="topAvatar" class="avatar" src="' + dataUri + '" alt="Profile">' :
    '<span id="topAvatar" class="avatar">' + esc(initials(state.me.Name)) + '</span>';
}
function setBusy(button, text) { if (!button) return; button.dataset.oldText = button.textContent; button.disabled = true; button.textContent = text; }
function resetBusyButtons() { document.querySelectorAll('button:disabled').forEach(button => { button.disabled = false; if (button.dataset.oldText) button.textContent = button.dataset.oldText; }); }
function toast(message, error) { const box = document.createElement('div'); box.className = 'toast' + (error ? ' error' : ''); box.textContent = message; document.body.appendChild(box); setTimeout(() => box.remove(), 4500); }
function val(id) { const el = document.getElementById(id); return el ? String(el.value || '').trim() : ''; }
function esc(value) { return String(value === undefined || value === null ? '' : value).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// Dynamic actions are inside double-quoted HTML attributes. Emit a safe
// single-quoted JavaScript value so ticket tabs and Open buttons remain valid.
function jsArg(value) {
  return "'" + String(value === undefined || value === null ? '' : value)
    .replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\r/g, '\\r').replace(/\n/g, '\\n')
    .replace(/</g, '\\x3c').replace(/>/g, '\\x3e').replace(/&/g, '\\x26') + "'";
}
function badgeClass(value) { return String(value || '').toLowerCase().replace(/\s+/g, ''); }
function initials(name) { return String(name || '?').trim().split(/\s+/).map(word => word[0]).slice(0,2).join('').toUpperCase(); }
function fmtDate(value) { if (!value) return '--'; const date = new Date(value); return isNaN(date) ? '--' : date.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(value) { if (!value) return '--'; const date = new Date(value); return isNaN(date) ? '--' : date.toLocaleString('en-IN'); }
function isoDate(date) { const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000); return local.toISOString().slice(0,10); }
function csvCell(value) { const text = String(value === undefined || value === null ? '' : value); return '"' + text.replace(/"/g,'""') + '"'; }
function uniqueClient(rows, key) { const seen = {}; return rows.filter(row => !seen[row[key]] && (seen[row[key]] = true)); }
function togglePassword(id) { const input = document.getElementById(id); input.type = input.type === 'password' ? 'text' : 'password'; }
function filterCurrentTables(query) {
  query = String(query || '').toLowerCase();
  document.querySelectorAll('table.searchable tbody tr').forEach(row => row.style.display = row.textContent.toLowerCase().indexOf(query) >= 0 ? '' : 'none');
}

function showInstallHelp() {
  closeUserMenu();
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(() => { deferredInstallPrompt = null; });
    return;
  }
  openModal('<h2>Install LPPL PMS on Your Phone</h2>' +
    '<p>This adds an LPPL PMS icon to the phone, so employees do not need to find the link every day.</p>' +
    '<div class="grid-2"><div><h3>Android · Chrome</h3><ol class="install-steps"><li>Open the PMS link in Chrome.</li><li>Tap the three-dot menu.</li><li>Tap <b>Add to Home screen</b> or <b>Install app</b>.</li><li>Confirm Add.</li></ol></div>' +
    '<div><h3>iPhone · Safari</h3><ol class="install-steps"><li>Open the PMS link in Safari.</li><li>Tap the Share button.</li><li>Tap <b>Add to Home Screen</b>.</li><li>Tap Add.</li></ol></div></div>' +
    '<div class="readonly-note">This is the recommended free mobile installation for the Apps Script pilot. It opens the same secure PMS and receives every web update automatically.</div>' +
    '<div class="actions"><button class="btn" onclick="closeModal()">Done</button></div>', true);
}
